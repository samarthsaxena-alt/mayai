<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MayAI</title>
<link rel="icon" href="/favicon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header>
  <h1><img src="/mayai-logo.png" alt="MayAI" style="height:26px;vertical-align:-6px" /></h1>
  <div id="header-status" class="muted"></div>
</header>
<nav id="modes">
  <button data-mode="quickstart" class="active">Quick Start</button>
  <button data-mode="customize">Customize</button>
</nav>
<nav id="tabs" style="display:none">
  <button data-tab="templates" class="active">Templates</button>
  <button data-tab="behavior">Behavior</button>
  <button data-tab="knowledge">Knowledge</button>
  <button data-tab="callflow">Call Flow</button>
  <button data-tab="actions">Actions</button>
  <button data-tab="analytics">Analytics</button>
  <button data-tab="advanced">Advanced</button>
</nav>
<main id="app"></main>
<div id="toast" style="display:none"></div>
<script src="/app.js"></script>
</body>
</html>
