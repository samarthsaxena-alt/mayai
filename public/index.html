<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MayAI</title>
<link rel="icon" href="/favicon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="/mayai-logo.png" alt="MayAI" /></div>
    <nav id="sidenav">
      <button data-mode="quickstart" data-tab="" class="active"><span class="si">🚀</span>Quick Start</button>
      <div class="sidenav-section">Customize</div>
      <button data-mode="customize" data-tab="templates"><span class="si">🗂️</span>Templates</button>
      <button data-mode="customize" data-tab="behavior"><span class="si">💬</span>Behavior</button>
      <button data-mode="customize" data-tab="knowledge"><span class="si">📚</span>Knowledge</button>
      <button data-mode="customize" data-tab="callflow"><span class="si">🔀</span>Call Flow</button>
      <button data-mode="customize" data-tab="actions"><span class="si">📋</span>Actions</button>
      <button data-mode="customize" data-tab="outcomes"><span class="si">🎯</span>Outcomes</button>
      <button data-mode="customize" data-tab="analytics"><span class="si">📊</span>Analytics</button>
      <button data-mode="customize" data-tab="advanced"><span class="si">⚙️</span>Advanced</button>
    </nav>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <h1 id="page-title">Quick Start</h1>
      <div class="topbar-right">
        <div id="header-status" class="status-chip"></div>
        <div class="avatar-circle">🙂</div>
      </div>
    </header>
    <main id="app"></main>
  </div>
</div>
<div id="toast" style="display:none"></div>
<script src="/webcall.js"></script>
<script src="/app.js"></script>
</body>
</html>
